<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NilRanbow Media RSS Feed</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 500px; text-align: center; border: 1px solid #334155; }
        h1 { font-size: 24px; margin-bottom: 12px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
        .btn { display: inline-block; background: #e60023; color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; transition: background 0.2s; }
        .btn:hover { background: #ad081b; }
        .code { background: #0f172a; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 13px; color: #a5f3fc; word-break: break-all; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>NilRanbow Media RSS Feed</h1>
        <p>This automated feed syndicates full-resolution Google CDN images, metadata, and post links formatted specifically for Pinterest and social media aggregators.</p>
        <a class="btn" href="feed.xml" target="_blank">View Live feed.xml</a>
        <div class="code">Target: https://nilranbow.blogspot.com</div>
    </div>
</body>
</html>
